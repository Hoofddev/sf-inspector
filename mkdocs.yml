site_name: SF Inspector
site_url: https://hoofddev.github.io/sf-inspector/
repo_url: https://github.com/Hoofddev/sf-inspector
site_author: Hoofddev

theme:
  name: material
  logo: assets/images/icon128.png
  favicon: assets/images/icon128.png
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  # Roboto is not fetched from Google on every page load, and the system stack in
  # assets/stylesheets/extra.css applies instead -- the same one the extension and the app use.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: custom
      accent: custom

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/Hoofddev

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-config.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - CHANGES.md
        - README.md
        - PRIVACY.md
      check_paths: true
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Welcome: welcome.md
      - Configure Connected App: how-to/#use-sf-inspector-with-a-connected-app
      - Release Notes: release-note.md
  - Features:
      - Data Management:
          - Data Export: data-export.md
          - Data Import: data-import.md
      - Debugging:
          - Debug Logs Viewer: logs-viewer.md
      - Metadata:
          - Dependencies Explorer: dependencies-explorer.md
          - Download Metadata: download-metadata.md
          - Field Creator: field-creator.md
          - Flow Scanner: flow-scanner.md
      - API:
          - Event Monitor: event-monitor.md
          - REST Explorer: rest-explorer.md
          - API Statistics: api-statistics.md
          - Org Limits: limits.md
          - SObject Cache Management: sobject-cache-management.md
      - How-To: how-to.md
  - Articles: articles.md

  - Support:
      - Troubleshooting: troubleshooting.md
      - Privacy Policy: privacy.md
      - Developer Notes: dev-notes.md


			shellScript = "# Ships everything in Resources, rather than the file-by-file list the converter wrote.\n#\n# That list is why the project used to be regenerated whenever a file was added to addon/: a new\n# file was copied into the source tree by scripts/build-safari.sh and then silently left out of\n# the built bundle, because nothing referenced it. Regenerating threw away every setting on the\n# project with it -- signing, entitlements, versions -- which is untenable for something that has\n# to ship. Copying the directory means the project no longer has an opinion about its contents.\nset -euo pipefail\nrsync -a --delete \"${SRCROOT}/SF Inspector Extension/Resources/\" \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/\"\n# The privacy manifest sits beside Resources rather than inside it, because that directory is\n# rsynced from the built payload and --delete would remove anything not in addon/.\ncp \"${SRCROOT}/SF Inspector Extension/PrivacyInfo.xcprivacy\" \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/\"\n";
		};
